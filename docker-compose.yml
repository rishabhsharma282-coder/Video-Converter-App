version: '3.8'

services:
  smart-trimmer-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-video-trimmer-pro
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always
